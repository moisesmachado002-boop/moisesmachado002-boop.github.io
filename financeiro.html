<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Meu Financeiro</title>
  <link rel="manifest" href="manifest-app.json?v=1.6.0">
  <link rel="icon" href="icon.svg?v=1.6.0" type="image/svg+xml">
  <script>
    (() => {
      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const veioDaCentral = new URLSearchParams(window.location.search).get('origem') === 'central';
      if (standalone && !veioDaCentral) window.location.replace('./index.html');
    })();
  </script>
</head>
<body>
  <div style="font-family:system-ui;padding:24px">Carregando Meu Financeiro...</div>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=1.6.0', { scope: './' })
          .then(registration => registration.update())
          .catch(error => console.warn('Modo offline não pôde ser atualizado:', error));
      });
    }
  </script>
  <script src="loader-app.js"></script>
</body>
</html>
