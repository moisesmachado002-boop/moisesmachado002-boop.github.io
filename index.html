<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Acesso rápido ao Financeiro, Faturas e Mentor IA.">
  <title>Central Moisés</title>
  <link rel="manifest" href="manifest.json?v=1.6.0">
  <link rel="icon" href="icon.svg?v=1.6.0" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at 15% 0%, rgba(37, 99, 235, .20), transparent 34rem),
        radial-gradient(circle at 100% 100%, rgba(124, 58, 237, .16), transparent 30rem),
        #07111f;
    }

    main {
      width: min(100%, 34rem);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    header { margin-bottom: 1.75rem; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      margin: 0 0 .65rem;
      color: #93c5fd;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: .5rem;
      height: .5rem;
      border-radius: 999px;
      background: #3b82f6;
      box-shadow: 0 0 1rem rgba(59, 130, 246, .8);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 9vw, 3rem);
      line-height: 1;
      letter-spacing: -.045em;
    }

    header p {
      margin: .75rem 0 0;
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.5;
    }

    nav {
      display: grid;
      gap: .85rem;
    }

    .card {
      --accent: #3b82f6;
      display: grid;
      grid-template-columns: 3.35rem 1fr auto;
      align-items: center;
      gap: 1rem;
      min-height: 5.7rem;
      padding: 1rem;
      color: inherit;
      text-decoration: none;
      background: rgba(15, 23, 42, .78);
      border: 1px solid rgba(148, 163, 184, .15);
      border-radius: 1.25rem;
      box-shadow: 0 .75rem 2rem rgba(0, 0, 0, .18);
      -webkit-tap-highlight-color: transparent;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .card:active { transform: scale(.985); }

    .card:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 60%, white);
      outline-offset: 3px;
    }

    @media (hover: hover) {
      .card:hover {
        transform: translateY(-2px);
        border-color: color-mix(in srgb, var(--accent) 55%, transparent);
        background: rgba(15, 23, 42, .96);
      }
    }

    .card.faturas { --accent: #10b981; }
    .card.mentor { --accent: #a855f7; }

    .icon {
      width: 3.35rem;
      height: 3.35rem;
      display: grid;
      place-items: center;
      border-radius: 1rem;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .icon svg {
      width: 1.65rem;
      height: 1.65rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .text strong {
      display: block;
      font-size: 1.06rem;
      line-height: 1.25;
    }

    .text span {
      display: block;
      margin-top: .28rem;
      color: #94a3b8;
      font-size: .88rem;
      line-height: 1.35;
    }

    .arrow {
      color: #64748b;
      font-size: 1.5rem;
      line-height: 1;
    }

    footer {
      margin-top: 1.4rem;
      color: #64748b;
      text-align: center;
      font-size: .8rem;
    }

    @media (max-width: 360px) {
      main { padding-inline: 1rem; }
      .card { grid-template-columns: 3rem 1fr auto; gap: .75rem; }
      .icon { width: 3rem; height: 3rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Seus aplicativos</p>
      <h1>Central Moisés</h1>
      <p>Escolha onde deseja entrar.</p>
    </header>

    <nav aria-label="Aplicativos">
      <a class="card" href="./financeiro.html?origem=central">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h12A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-12A2.5 2.5 0 0 1 3 16.5z"/><path d="M16 10h5v4h-5a2 2 0 0 1 0-4Z"/><path d="M6 5V3.5h10V5"/></svg>
        </span>
        <span class="text">
          <strong>Meu Financeiro</strong>
          <span>Gastos, contas e controle pessoal</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="card faturas" href="./controle-familiar/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-2-1.25L14 21l-2-1.25L10 21l-2-1.25L6 21z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
        </span>
        <span class="text">
          <strong>Faturas</strong>
          <span>Criar e consultar faturas</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="card mentor" href="./SIMULADO-01/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m3 9 9-5 9 5-9 5z"/><path d="M7 12v5c3 2 7 2 10 0v-5M21 9v6"/></svg>
        </span>
        <span class="text">
          <strong>Mentor IA</strong>
          <span>Estudos, questões e cronograma</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </nav>

    <footer>Todos os seus sistemas em um só lugar</footer>
  </main>

  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=1.6.0', { scope: './' })
          .then(registration => registration.update())
          .catch(error => console.warn('Modo offline não pôde ser atualizado:', error));
      });
    }
  </script>
</body>
</html>
