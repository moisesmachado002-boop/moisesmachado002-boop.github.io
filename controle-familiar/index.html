<!DOCTYPE html>

<head>

  <title>Gestão Financeira Familiar</title>
</head>
<body>
  <div style="font-family:system-ui;padding:24px">Carregando Gestão Financeira Familiar...</div>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=2.12.2', { scope: './' })
          .then(registration => registration.update())
          .catch(error => console.warn('Modo offline não pôde ser preparado:', error));
      });
    }
  </script>
  <script src="loader.js?v=2.12.2"></script>
</body>
</html>
